name: release

# Every push to main republishes a rolling "latest" release holding one portable zip per
# platform, so a tester can run get.sh / get.ps1 without a GitHub account or a build toolchain.
# The tag and the release are deleted and recreated each run: `latest` always points at the head
# of main and the download URLs never change.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

# Never let two pushes race on deleting/recreating the same tag. Queue instead of cancelling, so
# a half-finished publish is not left without a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- one portable zip per platform
  # Same build steps as ci.yml, plus the packaging: `cmake --install` writes dist/bin/{goonstein,
  # assets}, which is renamed to goonstein/ so the zip has exactly one top-level folder.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS arm64
            asset: goonstein-macos-arm64.zip
          - os: ubuntu-latest
            name: Linux x86-64
            asset: goonstein-linux-x86_64.zip
          - os: windows-latest
            name: Windows x86-64
            asset: goonstein-windows-x86_64.zip
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # SDL3 is built from source, so it needs the platform's dev headers.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config zip \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxrender-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev libvulkan-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      # D3D12 only eats DXIL, and signed DXIL needs Microsoft's dxil.dll, so it cannot be produced
      # on the macOS dev machine and is not committed. Without it a Windows package would boot only
      # where the driver also offers Vulkan (src/gfx.c falls through SPIR-V to DXIL). Compile it
      # here, before the install step copies assets/ into the layout.
      - name: Compile DXIL shaders
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/shaders.ps1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHOLLOW_PORTABLE=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Install layout
        run: cmake --install build --config Release --prefix dist

      # ---------------------------------------------------------------- Windows renders, not just builds
      # A Windows tester saw a black world with the UI still drawn over it, and then a crash: the
      # build was green the whole time, because building was all CI ever asked of it. This step runs
      # the packaged binary the way the tester runs it -- the portable layout, the D3D12 backend --
      # and then looks at the pixels. GitHub's Windows runners have no GPU, so D3D12 lands on WARP,
      # Microsoft's software adapter; that is slow but it is a real D3D12 device with a real shader
      # compiler, which is what catches a pipeline that will not compile or a format the backend
      # does not have.
      #
      # The portable build chdir's next to its own executable, so shot.png and run.log are written
      # into dist/bin regardless of where the step's shell happens to be standing.
      - name: Render smoke (D3D12 on WARP)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          SDL_GPU_DRIVER: direct3d12
          HOLLOW_SILENT: '1'
        run: |
          # Two runs. `menu` is the tester's launch exactly -- no flags, the front door over the
          # island -- because that is the screen they said was black. `shot` jumps straight into a
          # named level, so the frame it captures is the same scene every time and a change in it
          # means something.
          $runs = @(
            @{ name = 'menu'; args = @('--volume', '0', '--frames', '90') },
            @{ name = 'shot'; args = @('--volume', '0', '--level', 'island', '--frames', '90') }
          )
          $failed = @()
          foreach ($r in $runs) {
            $png = "$($r.name).png"; $log = "$($r.name).log"
            # A variable, then @argv: that is PowerShell's splat. @(...) around an expression is the
            # array operator instead, and would hand the exe one argument containing four words.
            $argv = $r.args + @('--screenshot', $png, '--log', $log)
            Write-Host "=== run '$($r.name)': goonstein.exe $($argv -join ' ') ==="
            & ./dist/bin/goonstein.exe @argv
            $code = $LASTEXITCODE
            if (Test-Path "dist/bin/$log") {
              Write-Host "---------------- $log ----------------"
              Get-Content "dist/bin/$log"
              Write-Host '-----------------------------------------'
            } else {
              Write-Host "no $log was written"
            }
            if ($code -ne 0) { $failed += "$($r.name): exited $code (a crash, or a startup that gave up)"; continue }
            if (-not (Test-Path "dist/bin/$png")) { $failed += "$($r.name): no screenshot, the run never got as far as a frame"; continue }
            # Exits non-zero on a black or near-uniform frame, which is exactly the bug the tester hit.
            python tools/shot_check.py "dist/bin/$png" --json
            if ($LASTEXITCODE -ne 0) { $failed += "$($r.name): the frame is blank" }
          }
          if ($failed.Count -gt 0) { throw ($failed -join '; ') }

      - name: Upload the render smoke evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-smoke-release
          path: |
            dist/bin/*.png
            dist/bin/*.log
          if-no-files-found: warn

      # SDL3 is linked statically and dlopens X11/Wayland/audio at runtime, so the binary should
      # need nothing beyond glibc. Anything else here would fail on a tester's machine.
      - name: Check shared library deps (ldd)
        if: runner.os == 'Linux'
        run: |
          ldd dist/bin/goonstein
          unexpected=$(ldd dist/bin/goonstein | awk '{print $1}' \
            | grep -Ev '^(linux-vdso\.so\.1|libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|libgcc_s\.so\.1|libatomic\.so\.1|/lib64/ld-linux-x86-64\.so\.2|ld-linux-x86-64\.so\.2)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::goonstein links non-standard shared libraries: $unexpected"
            exit 1
          fi
          echo "only standard system libraries -- portable"

      - name: Zip (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/bin goonstein
          zip -qry "${{ matrix.asset }}" goonstein
          unzip -l "${{ matrix.asset }}" | head -8
          du -h "${{ matrix.asset }}"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/bin goonstein
          # 7z keeps the top-level folder in the archive; Compress-Archive's handling of that
          # differs between PowerShell versions.
          7z a -tzip -bso0 "${{ matrix.asset }}" goonstein | Out-Null
          7z l "${{ matrix.asset }}" | Select-Object -First 12
          "{0:N1} MB" -f ((Get-Item "${{ matrix.asset }}").Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0   # already a zip

  # ---------------------------------------------------------------- rolling `latest` release
  publish:
    name: publish latest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - run: ls -lh zips

      - name: Recreate the latest tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Rolling build of \`main\` (\`${GITHUB_SHA:0:7}\`). Re-run the one-liner to update.

          **macOS / Linux**

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/get.sh | sh && ./goonstein/goonstein
          \`\`\`

          **Windows (PowerShell)**

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/get.ps1 | iex
          \`\`\`
          EOF
          # Delete both, in this order: --cleanup-tag removes the tag along with the release, and
          # the explicit push --delete covers a tag left behind by a previous failed run.
          gh release delete latest --yes --cleanup-tag || true
          git push --delete origin latest || true
          gh release create latest --target "$GITHUB_SHA" --title latest --notes-file notes.md zips/*.zip
          gh release view latest
