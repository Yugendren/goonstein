name: build
on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------- the three targets
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows (MSVC)
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # SDL3 is built from source, so it needs the platform's dev headers.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxrender-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev libvulkan-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      # D3D12 only eats DXIL, and signed DXIL needs Microsoft's dxil.dll, so it cannot be produced
      # on the macOS dev machine and is not committed. The render smoke below is only a fair copy of
      # a tester's machine if the packaged layout has it, so compile it here, before the install
      # step copies assets/ across. Same step as release.yml.
      - name: Compile DXIL shaders
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/shaders.ps1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHOLLOW_PORTABLE=ON
      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Install layout
        run: cmake --install build --config Release --prefix dist

      # ---------------------------------------------------------------- Windows renders, not just builds
      # A Windows tester saw a black world with the UI still drawn over it, and then a crash: the
      # build was green the whole time, because building was all CI ever asked of it. This step runs
      # the packaged binary the way the tester runs it -- the portable layout, the D3D12 backend --
      # and then looks at the pixels. GitHub's Windows runners have no GPU, so D3D12 lands on WARP,
      # Microsoft's software adapter; that is slow but it is a real D3D12 device with a real shader
      # compiler, which is what catches a pipeline that will not compile or a format the backend
      # does not have.
      #
      # The portable build chdir's next to its own executable, so shot.png and run.log are written
      # into dist/bin regardless of where the step's shell happens to be standing.
      - name: Render smoke (D3D12 on WARP)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          SDL_GPU_DRIVER: direct3d12
          HOLLOW_SILENT: '1'
        run: |
          & ./dist/bin/goonstein.exe --volume 0 --level island --frames 90 --screenshot shot.png --log run.log
          $code = $LASTEXITCODE
          if (Test-Path dist/bin/run.log) {
            Write-Host '---------------- run.log ----------------'
            Get-Content dist/bin/run.log
            Write-Host '-----------------------------------------'
          } else {
            Write-Host 'no run.log was written'
          }
          if ($code -ne 0) { throw "goonstein exited $code (a crash, or a startup that gave up)" }
          if (-not (Test-Path dist/bin/shot.png)) { throw 'no screenshot: the run never got as far as a frame' }
          # Exits non-zero on a black or near-uniform frame, which is exactly the bug the tester hit.
          python tools/shot_check.py dist/bin/shot.png --json

      - name: Upload the render smoke evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-smoke
          path: |
            dist/bin/shot.png
            dist/bin/run.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: goonstein-${{ runner.os }}
          path: dist
          if-no-files-found: error

  # ---------------------------------------------------------------- DXIL
  # Signed DXIL needs Microsoft's dxil.dll, which only ships on Windows, so the D3D12 shaders
  # cannot be produced on the macOS dev machine. This job compiles them from the committed HLSL
  # (tools/shaders.sh generates that HLSL on any platform) and uploads them. Download the artifact
  # and commit assets/shaders/*.dxil whenever a shader changes. Until DXIL is committed, a Windows
  # build runs on Vulkan if the driver offers it and otherwise stops at startup with a log line
  # naming this job.
  shaders-dxil:
    name: DXIL (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile HLSL to DXIL
        shell: pwsh
        run: ./tools/shaders.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shaders-dxil
          path: assets/shaders/*.dxil
          if-no-files-found: error

  # ---------------------------------------------------------------- shaders in sync
  # Catches a shaders/*.frag edit committed without re-running tools/shaders.sh.
  # The check hashes the GLSL sources against assets/shaders/sources.sha256 rather
  # than recompiling and diffing bytes: two shaderc builds emit different (equally
  # valid) SPIR-V for the same input, so a byte diff flagged every shader as stale
  # on a clean tree. No shader toolchain needed here as a result.
  shaders-check:
    name: shaders up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/shaders.sh --check

  # ---------------------------------------------------------------- content gate
  # Enforces DESIGN.md hard rules: no children references in game content
  content_gate:
    name: Content gate (DESIGN.md rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/content_gate.sh
