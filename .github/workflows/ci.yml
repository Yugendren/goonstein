name: build
on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------- the three targets
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows (MSVC)
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # SDL3 is built from source, so it needs the platform's dev headers.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxrender-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev libvulkan-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      # D3D12 only eats DXIL, and signed DXIL needs Microsoft's dxil.dll, so it cannot be produced
      # on the macOS dev machine and is not committed. The render smoke below is only a fair copy of
      # a tester's machine if the packaged layout has it, so compile it here, before the install
      # step copies assets/ across. Same step as release.yml.
      - name: Compile DXIL shaders
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/shaders.ps1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHOLLOW_PORTABLE=ON
      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Install layout
        run: cmake --install build --config Release --prefix dist

      # ---------------------------------------------------------------- Windows renders, not just builds
      # A Windows tester saw a black world with the UI still drawn over it, and then a crash: the
      # build was green the whole time, because building was all CI ever asked of it. This step runs
      # the packaged binary the way the tester runs it -- the portable layout, the D3D12 backend --
      # and then looks at the pixels. GitHub's Windows runners have no GPU, so D3D12 lands on WARP,
      # Microsoft's software adapter; that is slow but it is a real D3D12 device with a real shader
      # compiler, which is what catches a pipeline that will not compile or a format the backend
      # does not have.
      #
      # The portable build chdir's next to its own executable, so shot.png and run.log are written
      # into dist/bin regardless of where the step's shell happens to be standing.
      - name: Render smoke (D3D12 on WARP)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          SDL_GPU_DRIVER: direct3d12
          HOLLOW_SILENT: '1'
        run: |
          # Two runs. `menu` is the tester's launch exactly -- no flags, the front door over the
          # island -- because that is the screen they said was black. `shot` jumps straight into a
          # named level, so the frame it captures is the same scene every time and a change in it
          # means something.
          $runs = @(
            @{ name = 'menu'; args = @('--volume', '0', '--frames', '90') },
            @{ name = 'shot'; args = @('--volume', '0', '--level', 'island', '--frames', '90') }
          )
          $failed = @()
          foreach ($r in $runs) {
            $png = "$($r.name).png"; $log = "$($r.name).log"
            # A variable, then @argv: that is PowerShell's splat. @(...) around an expression is the
            # array operator instead, and would hand the exe one argument containing four words.
            $argv = $r.args + @('--screenshot', $png, '--log', $log)
            Write-Host "=== run '$($r.name)': goonstein.exe $($argv -join ' ') ==="
            & ./dist/bin/goonstein.exe @argv
            $code = $LASTEXITCODE
            if (Test-Path "dist/bin/$log") {
              Write-Host "---------------- $log ----------------"
              Get-Content "dist/bin/$log"
              Write-Host '-----------------------------------------'
            } else {
              Write-Host "no $log was written"
            }
            if ($code -ne 0) { $failed += "$($r.name): exited $code (a crash, or a startup that gave up)"; continue }
            if (-not (Test-Path "dist/bin/$png")) { $failed += "$($r.name): no screenshot, the run never got as far as a frame"; continue }
            # Exits non-zero on a black or near-uniform frame, which is exactly the bug the tester hit.
            python tools/shot_check.py "dist/bin/$png" --json
            if ($LASTEXITCODE -ne 0) { $failed += "$($r.name): the frame is blank" }
          }
          if ($failed.Count -gt 0) { throw ($failed -join '; ') }

      - name: Upload the render smoke evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-render-smoke
          path: |
            dist/bin/*.png
            dist/bin/*.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: goonstein-${{ runner.os }}
          path: dist
          if-no-files-found: error

  # ---------------------------------------------------------------- DXIL
  # Signed DXIL needs Microsoft's dxil.dll, which only ships on Windows, so the D3D12 shaders
  # cannot be produced on the macOS dev machine. This job compiles them from the committed HLSL
  # (tools/shaders.sh generates that HLSL on any platform) and uploads them. Download the artifact
  # and commit assets/shaders/*.dxil whenever a shader changes. Until DXIL is committed, a Windows
  # build runs on Vulkan if the driver offers it and otherwise stops at startup with a log line
  # naming this job.
  shaders-dxil:
    name: DXIL (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile HLSL to DXIL
        shell: pwsh
        run: ./tools/shaders.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shaders-dxil
          path: assets/shaders/*.dxil
          if-no-files-found: error

  # ---------------------------------------------------------------- shaders in sync
  # Catches a shaders/*.frag edit committed without re-running tools/shaders.sh.
  # The check hashes the GLSL sources against assets/shaders/sources.sha256 rather
  # than recompiling and diffing bytes: two shaderc builds emit different (equally
  # valid) SPIR-V for the same input, so a byte diff flagged every shader as stale
  # on a clean tree. No shader toolchain needed here as a result.
  shaders-check:
    name: shaders up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/shaders.sh --check

  # ---------------------------------------------------------------- content gate
  # Enforces DESIGN.md hard rules: no children references in game content
  content_gate:
    name: Content gate (DESIGN.md rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/content_gate.sh

  # ---------------------------------------------------------------- perf bench
  # Runs the four --bench camera paths (src/bench.c) headless and checks the result against
  # bench_baseline.json's per-machine numbers with tools/bench_check.py. Frame time is a property
  # of the machine it was measured on (see bench_baseline.json's "_comment"), so this only gates
  # anything once this runner's own machine_tag has a baseline entry -- see the --allow-missing-
  # baseline note below.
  bench:
    name: Perf bench (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: macOS deps
        run: brew install ninja

      # Same configure/build/install as the macOS leg of the `build` job above.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHOLLOW_PORTABLE=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Install layout
        run: cmake --install build --config Release --prefix dist

      # The portable build chdir's next to its own executable (see the Windows render smoke step's
      # comment above), so bench.json lands in dist/bin regardless of the shell's own cwd.
      # Three times, because a shared CI runner is noisier than the 15% gate is wide. bench_check.py
      # takes the lowest median per path across the runs it is given: noise only ever adds time,
      # so of two runs of identical work the faster one is the one closer to what the work costs.
      - name: Run the four bench paths (three times)
        working-directory: dist/bin
        env:
          HOLLOW_SILENT: '1'
        run: |
          ./goonstein --bench bench.json --volume 0
          ./goonstein --bench bench2.json --volume 0
          ./goonstein --bench bench3.json --volume 0

      - name: Print bench.json
        working-directory: dist/bin
        run: cat bench.json

      - name: Compare against the baseline
        working-directory: dist/bin
        run: |
          # This runner's tag (metal/macOS/3) is in bench_baseline.json with a tolerance of its
          # own: three shared cores and a shared GPU swing far too wide for the 15% this project
          # holds itself to on a real machine, so what the gate catches here is a doubling. If a
          # content change moves the draw or triangle counts, the check says so by name and the
          # answer is to re-take the baseline in that same commit -- not to widen this.
          python3 ../../tools/bench_check.py ../../bench_baseline.json bench.json bench2.json bench3.json --tol 0.15

      - uses: actions/upload-artifact@v4
        with:
          name: bench-macos
          path: |
            dist/bin/bench.json
            dist/bin/bench2.json
            dist/bin/bench3.json
          if-no-files-found: error
